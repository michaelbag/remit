{% load i18n static %}

<div id="nav-sidebar" class="nav-sidebar">
    <div class="nav-sidebar-header">
        <h3>{% trans 'Navigation' %}</h3>
    </div>
    
    {% if app_list %}
        <div class="nav-apps">
            {% for app in app_list %}
                <div class="nav-app" data-app-label="{{ app.app_label }}">
                    <div class="nav-app-header" onclick="toggleNavApp('{{ app.app_label }}')">
                        <span class="nav-collapse-icon" id="nav-icon-{{ app.app_label }}">▼</span>
                        <span class="nav-app-title">{{ app.name }}</span>
                    </div>
                    <div class="nav-app-content" id="nav-content-{{ app.app_label }}" style="display: none;">
                        <ul class="nav-models">
                            {% for model in app.models %}
                                {% if model.admin_url %}
                                    <li class="nav-model">
                                        <a href="{{ model.admin_url }}" class="nav-model-link" data-model="{{ model.object_name|lower }}">
                                            {{ model.name }}
                                        </a>
                                    </li>
                                {% endif %}
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% endif %}
</div>
